<header class="site-header">
  <div class="announce-bar">
    <div class="wrap announce-bar__inner">
      <span class="announce-bar__tagline">{{ site.header_tagline }}</span>
      <span class="announce-bar__contact">
        <span class="announce-bar__hours">{{ site.company_hours }}</span>
        <a class="announce-bar__tel" href="tel:{{ site.company_tel | remove: '-' }}">{{ site.company_tel }}</a>
      </span>
    </div>
  </div>
  <div class="wrap site-header__bar">
    <a href="{{ '/' | relative_url }}" class="brand">
      <img class="brand__logo" src="{{ '/assets/kenzaimart-logo.png' | relative_url }}" alt="建材マート">
      <span class="brand__sub">見積もり専用サイト</span>
    </a>

    <nav class="site-nav" id="site-nav">
      <a href="{{ '/products/' | relative_url }}">商品を探す</a>
      <a href="{{ '/#flow' | relative_url }}">ご利用の流れ</a>
      <a href="{{ '/#categories' | relative_url }}">カテゴリー</a>
      <a href="{{ '/contact/' | relative_url }}">お問い合わせ</a>
      <a href="{{ '/company/' | relative_url }}">会社概要</a>
    </nav>

    <div class="header-actions">
      <a href="{{ '/quote/' | relative_url }}" class="quote-pill">
        見積もりリスト
        <span class="quote-pill__count" id="quote-count">0</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-nav">
        <span></span>
      </button>
    </div>
  </div>
</header>
