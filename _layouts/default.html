<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo title=false %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16x16.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#1C2B3A">
</head>
<body>
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <div class="quote-modal" id="quote-added-modal" hidden>
    <div class="quote-modal__overlay" data-modal-close></div>
    <div class="quote-modal__box" role="dialog" aria-modal="true" aria-labelledby="quote-modal-name">
      <button type="button" class="quote-modal__close" data-modal-close aria-label="閉じる">&times;</button>
      <p class="quote-modal__eyebrow">見積もりリストに追加しました</p>
      <div class="quote-modal__product">
        <img class="quote-modal__photo" id="quote-modal-photo" src="" alt="">
        <p class="quote-modal__name" id="quote-modal-name"></p>
      </div>
      <div class="quote-modal__actions">
        <button type="button" class="btn btn--ghost" data-modal-close>商品を探す</button>
        <a class="btn btn--primary" href="{{ '/quote/' | relative_url }}">見積もりをする</a>
      </div>
    </div>
  </div>

  <script>
    window.SITE = {
      baseurl: "{{ site.baseurl }}",
      companyEmail: "{{ site.company_email }}"
    };
  </script>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
